[project]
name = "newt-starter-yam"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "newt @ git+ssh://git@github.com/new-theory-research/newt-python.git@32671a4005583982c2aba3f7f8f89764939a4ab6",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
