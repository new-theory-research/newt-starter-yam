[project]
name = "newt-starter-yam"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "newt @ git+ssh://git@github.com/new-theory-research/newt-python.git@e970b626407fe905706af457e44d791e1c8e8d0c",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
